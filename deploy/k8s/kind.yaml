# A one-node cluster for the local kill test. The node image is pinned by
# digest (the one kind v0.33.0 ships with).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # The dev overlay exposes the collector on node port 30318. This makes it
    # reachable from the host at 127.0.0.1:14318, behind both collector pods.
    extraPortMappings:
      - containerPort: 30318
        hostPort: 14318
        listenAddress: 127.0.0.1
        protocol: TCP
