# NOT part of the kustomization. Copy it, fill in real values and apply it, or
# create the Secret from your secret manager. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: rolda-secrets
  namespace: rolda
type: Opaque
stringData:
  CLICKHOUSE_USER: ""
  CLICKHOUSE_PASSWORD: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  ROLDA_API_TOKEN: ""   # at least 16 characters
  ROLDA_OTLP_TOKEN: ""  # agents send it as "Authorization: Bearer <token>"
