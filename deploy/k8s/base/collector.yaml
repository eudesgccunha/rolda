# A StatefulSet, so each pod keeps its own disk queue (otelcol.yaml) when it
# restarts or is rescheduled.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rolda-collector
  labels:
    app.kubernetes.io/name: rolda-collector
spec:
  serviceName: rolda-collector
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: rolda-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rolda-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
          args: ["--config=/etc/otelcol/otelcol.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: rolda-config
                  key: ROLDA_CLICKHOUSE_HOST
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol
      volumes:
        - name: config
          configMap:
            name: otelcol-config
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rolda-collector
spec:
  selector:
    app.kubernetes.io/name: rolda-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rolda-collector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rolda-collector
