apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolda-api
  labels:
    app.kubernetes.io/name: rolda-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rolda-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rolda-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: rolda
          command: ["python", "-m", "rolda.entrypoints.migrate"]
          envFrom:
            - configMapRef:
                name: rolda-config
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: rolda
          command: ["python", "-m", "rolda.entrypoints.api_main"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rolda-config
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: POSTGRES_PASSWORD
            - name: ROLDA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rolda-secrets
                  key: ROLDA_API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rolda-api
spec:
  selector:
    app.kubernetes.io/name: rolda-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rolda-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rolda-api
