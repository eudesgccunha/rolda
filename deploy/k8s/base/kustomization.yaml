apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rolda

resources:
  - namespace.yaml
  - config.yaml
  - collector.yaml
  - api.yaml
  - worker.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: otelcol-config
    files:
      - otelcol.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: rolda
    includeSelectors: false

# The image is a placeholder. Overlays set the real one.
images:
  - name: rolda
    newName: rolda
    newTag: latest
