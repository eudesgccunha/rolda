# Dependency updates arrive as pull requests against develop. The cooldown
# keeps a freshly published release out for a week: a malicious version is
# usually found and pulled within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A database version change needs a plan and the integration and kill
    # tests, so it is made by hand, never by an automatic pull request.
    # ClickHouse is pinned to a long term support line (25.8). Its monthly
    # releases get a short support window, and the next LTS is a decision for
    # a person. Only patch updates of the pinned line arrive here.
    ignore:
      - dependency-name: clickhouse/clickhouse-server
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
