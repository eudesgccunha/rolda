# Dependency updates arrive as pull requests against develop. The cooldown
# keeps a freshly published release out for a week: a malicious version is
# usually found and pulled within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
