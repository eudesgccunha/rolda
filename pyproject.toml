[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolda"
version = "0.1.0"
description = "Observability for AI agents in production"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["observability", "ai-agents", "opentelemetry", "monitoring"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "clickhouse-connect>=1.13.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/eudesgccunha/rolda"
Issues = "https://github.com/eudesgccunha/rolda/issues"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.14",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "ruff>=0.9",
    "zizmor>=1.33.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rolda"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PT",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements.
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: needs the Compose stack running (deploy/compose)",
]

[tool.bandit]
exclude_dirs = ["tests"]
